spatial:
  note: "Ground surfaces G_Y1-G_Y5 and G_Y17-G_Y21 partition the open ground; G_Y6-G_Y8 lie on roofs."
  ground_partition: [natural_ground_preserved, ground_green_unbuilt, bed_800, bed_600_799, bed_200_599,
                     water_ponds, paving_grass_reinforced, paving_gravel, paving_jointed, sealed]
  roof: [roof_300, roof_110_299, roof_50_109]
  overlays_on_base: true
  planting_qualities: [field_diversity, natural_species, flower_display, shrubs_experience, butterfly_bed,
                       shrubs_berry, roof_or_multilayer, vegetated_ground_air]
  quality_requires:            # used by advice only; the calculation follows the city's template
    visible_green_roof: [roof_300, roof_110_299, roof_50_109]
    sedum_diversity: [roof_110_299, roof_50_109]
    green_roofs_air: [roof_300, roof_110_299, roof_50_109]
    slab_bed_300: [bed_800, bed_600_799, bed_200_599]
    slab_bed_50_299: [bed_800, bed_600_799, bed_200_599]
    ground_green_infiltration: [ground_green_unbuilt, natural_ground_preserved]
    permeable_paving: [paving_grass_reinforced, paving_gravel, paving_jointed]
    green_walls_experience: [wall_green]
    wall_green_air: [wall_green]
    balcony_climbers: [balcony_green]
    water_experience: [water_ponds]
    water_permanent: [water_ponds]
  within_rules:
  - factors: [tree_existing_large, tree_existing_other, tree_new_large, tree_new_medium, tree_new_small,
              trees_experience, fruit_flowering_trees, tree_old_coarse, tree_character, tree_berry,
              shade_trees, wind_trees, trees_air, trees_air_species]
    within: [natural_ground_preserved, ground_green_unbuilt, bed_800, bed_600_799]
    severity: warning
    source: verdiq_check
    text: "Tree is not inside unbuilt ground or a planting bed of at least 600 mm"

