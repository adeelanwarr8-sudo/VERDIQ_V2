# Nacka kommun - Grönytefaktor Nacka stad, version 2 (oktober 2019)
# Factors, groups and template cells generated from the official
# 'berakningsmall-gronytefaktor-nacka-stad-version-2.xlsx' and checked against the guide.
meta:
  id: se-nacka-gyf-nacka-stad
  name: {sv: "Grönytefaktor - Nacka stad", en: "Green area factor - Nacka stad"}
  country: SE
  municipality: Nacka
  scheme: GYF
  version: "2019-10"
  effective_from: 2019-10-01
  status: verified        # engine output = official template recalculated in LibreOffice (tests/test_nacka_template.py)
  crs: "EPSG:3006"
  languages: [sv]

sources:
  - title: "Grönytefaktor Nacka stad, version 2, oktober 2019"
    pages: "4-6 (balancing, target), 12-21 (factors and unit areas)"
    retrieved: 2026-11-07
  - title: "Beräkningsmall grönytefaktor Nacka stad, version 2 (xlsx)"
    retrieved: 2026-11-07

score:
  type: weighted_area_ratio
  rounding: 2

targets:
  type: fixed
  target: 0.6
  note: "Ambition for residential blocks in Nacka stad"
  allow_project_override: true

balancing:
  method: factor_count
  status: verified
  rule: "At least 60% of selectable qualities in S and D, and at least 50% in B, K and L"
  groups:
    - {id: S, name: {sv: Sociala värden, en: Social values}, min_share: 0.60, max_count: 16}
    - {id: D, name: {sv: Dagvattenhantering, en: Stormwater management}, min_share: 0.60, max_count: 10}
    - {id: B, name: {sv: Biologisk mångfald, en: Biodiversity}, min_share: 0.50, max_count: 15}
    - {id: K, name: {sv: Lokalklimat, en: Local climate}, min_share: 0.50, max_count: 6}
    - {id: L, name: {sv: Luftrening, en: Air purification}, min_share: 0.50, max_count: 5}
  exclusive_sets:
    - ids: [infiltrate_10mm, infiltrate_15mm, infiltrate_20mm, tank_10mm]
      text: "Enbart en av kvaliteterna för fördröjning och rening väljs"


