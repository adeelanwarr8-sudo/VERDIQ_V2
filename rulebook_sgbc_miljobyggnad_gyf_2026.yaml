# Sweden Green Building Council (SGBC) - Beräkningsverktyg Grönytefaktor inom Miljöbyggnad (MB Nybyggnad / MB Ombyggnad)
# Factors, groups, dependency rules and cell map generated from SGBC's own Excel tool
# 'Berakningsverktyg-GYF-MB-Nybyggnad-MB-Ombyggnad.xlsx' and verified by recalculating that file.
# Used for Miljöbyggnad 4.0 indicator 11 (Ekosystemtjänster) where the municipality has no required model.
meta:
  id: se-sgbc-miljobyggnad-gyf
  name: {sv: "Grönytefaktor inom Miljöbyggnad (SGBC)", en: "Green area factor for Miljöbyggnad (SGBC)"}
  country: SE
  municipality: "SGBC Miljöbyggnad (hela Sverige)"
  scheme: MB-GYF
  version: "2026"
  status: verified        # engine output = SGBC's Excel tool recalculated in LibreOffice (tests/test_sgbc_template.py)
  crs: "EPSG:3006"
  languages: [sv]

sources:
  - title: "Beräkningsverktyg Grönytefaktor MB Nybyggnad och MB Ombyggnad (SGBC, xlsx)"
    note: "Sheets: Introduktion, Indata o resultat GYF-beräkning, Ordförklaring Grönska o vatten"
    retrieved: 2026-11-07
  - title: "SGBC: nytt verktyg för beräkning av grönytefaktor i Miljöbyggnad 4.0"
    url: "https://www.sgbc.se"
    retrieved: 2026-11-07

score:
  type: weighted_area_ratio
  rounding: 2

targets:
  type: lookup
  by: built_share_pct
  table:
    - {lt: 50, target: 0.8}
    - {gte: 50, target: 0.4}
  note: "Målvärden MB Nybyggnad: under 50% bebyggd minst 0,8; 50% eller mer minst 0,4"
  allow_project_override: true

balancing:
  method: factor_count
  status: verified
  required: false         # the tool reports shares per group but sets no minimum
  rule: "Shares of supporting, regulating and cultural ecosystem services are reported (no minimum in the tool)"
  groups:
    - {id: S, name: {sv: Stödjande, en: Supporting}, max_count: 43}
    - {id: R, name: {sv: Reglerande, en: Regulating}, max_count: 46}
    - {id: K, name: {sv: Kulturella, en: Cultural}, max_count: 40}

spatial:
  ground_partition: [natural_ground_preserved, bed_unbuilt, bed_slab_800, bed_slab_600_800, bed_slab_200_600,
                     water_ponds, sealed, paving_semi_open, paving_open, paving_jointed]
  roof: [roof_400, roof_250_400, roof_120_250, roof_50_120]
  overlays_on_base: true
  planting_qualities: [field_diversity, roof_diversity_90, habitat_species, pollinator_bed, shrub_plantings_hedges,
                       multilayer_vegetation]
  within_rules:
  - factors: [tree_existing, tree_existing_landscape, tree_new_small, tree_new_medium, tree_new_large, tree_character,
              tree_berry, tree_pollinator, shade_trees]
    within: [natural_ground_preserved, bed_unbuilt, bed_slab_800, bed_slab_600_800]
    severity: warning
    source: verdiq_check
    text: "Tree is not inside natural ground or a planting bed of at least 600 mm"

